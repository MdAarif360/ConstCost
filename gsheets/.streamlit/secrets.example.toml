# Copy this file to .streamlit/secrets.toml for local testing.
# In Streamlit Community Cloud, paste the same content into the app secrets box.
#
# Pick ONE authentication method below: [google_oauth] (your own Google
# account) or [gcp_service_account] (a robot account). If both are present,
# [google_oauth] wins.

# The spreadsheet that stores expenses, budgets and (optionally) bills.
# Take the id from the sheet URL:
# https://docs.google.com/spreadsheets/d/<THIS PART>/edit
GSHEETS_SPREADSHEET_ID = "1AbCdEfGhIjKlMnOpQrStUvWxYz0123456789"

# Alternatives to GSHEETS_SPREADSHEET_ID (use only one):
# GSHEETS_SPREADSHEET_URL = "https://docs.google.com/spreadsheets/d/.../edit"
# GSHEETS_SPREADSHEET_NAME = "Construction Cost Tracker"

# Optional. When set, uploaded bills are stored as real files in this Google
# Drive folder instead of as base64 chunks inside the spreadsheet.
# With [google_oauth], the folder just needs to be in your own Drive.
# With [gcp_service_account], share the folder with the service account as
# an Editor.
# GDRIVE_FOLDER_ID = "1FolderIdInYourDrive"

# Optional. Seconds to reuse sheet reads before calling Google again.
# GSHEETS_CACHE_TTL_SECONDS = "20"

# ---------------------------------------------------------------------------
# Method 1: OAuth2 as your own Google account. No sharing step -- the sheet
# just needs to live in your own Drive. Generate these three values by
# running `python authorize_google.py path/to/client_secret.json` once (see
# that file's docstring for the one-time Google Cloud setup).
# ---------------------------------------------------------------------------
[google_oauth]
client_id = "123456789012-abcdefghijklmnopqrstuvwxyz012345.apps.googleusercontent.com"
client_secret = "GOCSPX-abcdefghijklmnopqrstuvwxyz"
refresh_token = "1//0abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"

# ---------------------------------------------------------------------------
# Method 2: a service account (robot identity). Comment out [google_oauth]
# above and share the sheet with client_email below as an Editor.
# ---------------------------------------------------------------------------
# [gcp_service_account]
# type = "service_account"
# project_id = "your-project-id"
# private_key_id = "0123456789abcdef0123456789abcdef01234567"
# private_key = "-----BEGIN PRIVATE KEY-----\nMIIEv...\n-----END PRIVATE KEY-----\n"
# client_email = "cost-tracker@your-project-id.iam.gserviceaccount.com"
# client_id = "123456789012345678901"
# auth_uri = "https://accounts.google.com/o/oauth2/auth"
# token_uri = "https://oauth2.googleapis.com/token"
# auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
# client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/cost-tracker%40your-project-id.iam.gserviceaccount.com"

# A single [connections.gsheets] section also works, with either credential
# set's fields plus a "spreadsheet" key holding the sheet URL, id or name:
#
# [connections.gsheets]
# spreadsheet = "https://docs.google.com/spreadsheets/d/.../edit"
# client_id = "...apps.googleusercontent.com"
# client_secret = "..."
# refresh_token = "..."
